<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The owner asked for no pinch zoom: the app behaves like a native one -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>MyWallet — Quản lý chi tiêu</title>

    <!-- Icons & Favicon -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <!-- One theme-color, set to the header/bottom-bar surface by theme-init.js and ThemeContext -->
    <meta name="theme-color" content="#2d2621" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyWallet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script src="/theme-init.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap&subset=vietnamese" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>MyWallet cần JavaScript để chạy.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
